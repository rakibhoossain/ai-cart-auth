version: '3.8'

services:
  ai-cart-auth:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ai-cart-auth
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      - PORT=8080
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    networks:
      - ai-cart-auth-network

networks:
  ai-cart-auth-network:
    driver: bridge

